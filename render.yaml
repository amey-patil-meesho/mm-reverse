# Render Blueprint for MM Reverse (standalone repo).
# Single Docker image: Node serves the built React SPA + /api. The Dockerfile is at the repo root.
services:
  - type: web
    name: mm-reverse
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter          # always-on instance ($7/mo): no spin-down, no cold starts.
    # No healthCheckPath: Render's HTTP health check was timing out (5s) during brief slow moments
    # and restarting the instance. Without it, Render marks the service healthy once it binds the port.
    disk:                  # persistent storage so the SQLite data survives restarts/deploys
      name: mm-reverse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAILS
        value: amey.patil1@meesho.com
      - key: DB_PATH        # keep the SQLite DB on the persistent disk
        value: /var/data/mm_reverse.db
      # Start empty (no baked-in sample); admin uploads the workbook to load riders.
      - key: SEED_CSV
        value: /app/backend/seed/none.csv
      # Secrets — set in the Render dashboard, not committed:
      - key: ADMIN_ACCESS_CODE   # admin login code (you chose AMEY)
        sync: false
      - key: BRIDGE_TOKEN        # must match the Apps Script gateway TOKEN (only if you use the bridge)
        sync: false
